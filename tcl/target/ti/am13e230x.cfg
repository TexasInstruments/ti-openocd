if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME AM13E230X
}

if { [info exists CPUTAPID] } {
	set _DAP_TAPID $CPUTAPID
} else {
	set _DAP_TAPID 0x6ba00477
}

if { [info exists DAP_SWD_ID] } {
	set _DAP_SWD_ID $DAP_SWD_ID
} else {
	set _DAP_SWD_ID 0x6ba02477
}

source [find target/swj-dp.tcl]

swj_newdap $_CHIPNAME cpu -irlen 4 \
	-expected-id $_DAP_TAPID \
	-expected-id $_DAP_SWD_ID

dap create $_CHIPNAME.dap -tap $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

if { [info exists WORKAREABASE] } {
	set _WORKAREABASE $WORKAREABASE
} else {
	set _WORKAREABASE 0x20000000
}
if { [info exists WORKAREASIZE] } {
	set _WORKAREASIZE $WORKAREASIZE
} else {
	set _WORKAREASIZE 0x8000
}

$_TARGETNAME configure -work-area-phys $_WORKAREABASE -work-area-size $_WORKAREASIZE -work-area-backup 0

set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME.main am13 0x00000000 0 0 0 $_TARGETNAME
flash bank $_FLASHNAME.nonmain am13 0x60100000 0 0 0 $_TARGETNAME

if {![using_hla]} {
	# AM13E230X has no SRST pin; use SYSRESETREQ to perform a soft reset.
	# (HLA adapters issue SYSRESETREQ unconditionally and ignore this setting.)
	cortex_m reset_config sysresetreq
}

# Mirror DSSM factory-reset logic from am13_cs_dap_init.gel / am13e230x.gel
proc am13_factory_reset {} {
	echo "Initiating Device Factory Reset"

	# Ensure CS_DAP is available; try to connect
	catch {
		$_TARGETNAME arp_examine
	} err

	# Send factory-reset command (0x020A) via SEC_AP mailbox
	# SECAP::TCR at AP index 2, offset 0x4
	$::_CHIPNAME.dap apreg 2 0x4 0x020a
	# SECAP::TDR at AP index 2, offset 0x0
	$::_CHIPNAME.dap apreg 2 0x0 0x0

	echo "Command Sent = 0x0000020A"
	echo "Press the reset button..."

	# Wait for ROM response (rx_valid bit in RCR at offset 0xC)
	set timeout 1000
	set success 0
	while { $timeout > 0 } {
		set rcr [$::_CHIPNAME.dap apreg 2 0xc]
		# rx_valid = bit 0
		if { [expr { $rcr & 0x1 }] == 0x1 } {
			# Read RXD (offset 0x8) to clear valid bit and capture response
			set rxd [$::_CHIPNAME.dap apreg 2 0x8]
			echo "DATA Response = 0x[format %08x $rxd]"

			# Check expected response: command echo in RCR (mask 0x00FE per .gel), RXD == 0x10003
			set rcmd [expr { $rcr & 0x00fe }]
			if { $rcmd == 0x0a && $rxd == 0x10003 } {
				set success 1
			} else {
				echo "Unexpected response: RCR=0x[format %08x $rcr] RXD=0x[format %08x $rxd]"
			}
			break
		}
		sleep 10
		set timeout [expr { $timeout - 1 }]
	}

	if { $timeout == 0 } {
		echo "Timeout waiting for factory reset response"
		return -code error "AM13 factory reset timeout"
	}

	if { $success == 1 } {
		echo "Command execution completed."
		echo "Factory Reset executed. Please terminate debug session, power-cycle and restart debug session."
		# Exit cleanly so OpenOCD doesn't spam errors after target reset
		shutdown
		return 0
	} else {
		echo "Command execution failed."
		return -code error "AM13 factory reset failed"
	}
}

add_help_text am13_factory_reset "Initiate device factory reset via DSSM / SEC_AP mailbox (mirrors GEL DSSM_FactoryReset)"

# PWR-AP (AP index 4) register offsets
# DPREC0: bit 3 = FRCACT (force active), bit 14 = RST_CTL[0] (Wait For Debug), 
#         bit 16 = RST_CTL[2] (Halt On Reset), bit 20 = IHIB_SLP (inhibit sleep)
# SPREC: write 1 to trigger SYSRST

# Force debug power domain active and configure wait-for-debug on examine
proc _am13_enable_debug_domain {} {
	# FRCACT(3)=1 | IHIB_SLP(20)=1 | RST_CTL=Wait For Debug (001b at bits 14:16 = 0x4000)
	$::_CHIPNAME.dap apreg 4 0x00 0x104008
}

$_TARGETNAME configure -event examine-start { _am13_enable_debug_domain }

# Custom reset handler using PWR-AP DPREC/SPREC
proc _am13_custom_reset_assert {} {
	global ::reset_halt_requested
	if {[info exists ::reset_halt_requested]} {
		set reset_halt $::reset_halt_requested
	} else {
		set reset_halt 0
	}

	# DPREC0: FRCACT(3)=1 | IHIB_SLP(20)=1 | RST_CTL
	if {$reset_halt} {
		# RST_CTL = 100b (Halt On Reset) = 1 << 16 = 0x10000
		$::_CHIPNAME.dap apreg 4 0x00 0x110008
	} else {
		# RST_CTL = 001b (Wait For Debug) = 1 << 14 = 0x4000
		$::_CHIPNAME.dap apreg 4 0x00 0x104008
	}
	# Trigger SYSRST via SPREC
	$::_CHIPNAME.dap apreg 4 0xF0 0x01
	# Clear RST_CTL, keep FRCACT + IHIB_SLP
	$::_CHIPNAME.dap apreg 4 0x00 0x100008
}

# Install reset wrapper to intercept halt vs run
proc _am13_install_reset_wrapper {} {
	if {[info commands ocd_process_reset_original] ne ""} {
		return
	}
	rename ocd_process_reset ocd_process_reset_original
	proc ocd_process_reset {MODE} {
		global ::reset_halt_requested
		if {$MODE == "halt" || $MODE == "init"} {
			set ::reset_halt_requested 1
		} else {
			set ::reset_halt_requested 0
		}
		return [ocd_process_reset_original $MODE]
	}
}

lappend post_init_commands _am13_install_reset_wrapper

# Configure reset-assert event to use our custom handler
${_TARGETNAME} configure -event reset-assert { _am13_custom_reset_assert }
